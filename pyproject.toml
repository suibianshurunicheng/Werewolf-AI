[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "werewolf-classic-sft"
version = "0.1.0"
description = "Chinese Werewolf player-view SFT and static evaluation"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = ["PyYAML==6.0.2", "jsonschema==4.23.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["ml: optional local tensor/model integration tests"]
