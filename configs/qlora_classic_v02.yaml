# Standalone frozen experiment config. Eval protocol stays identical to v0.1.
project: Werewolf-3.5B-Classic
model:
  name: Qwen/Qwen3-4B-Instruct-2507
  revision_manifest: reports/models/Qwen3-4B-Instruct-2507.json
  trust_remote_code: false
data:
  version: dataset_v0.2
  root: data/prepared/dataset_v0.2
  board: classic_12
  max_length: 1024
  packing: false
  overlength: reject
quantization:
  enabled: true
  type: nf4
  double_quant: true
  compute_dtype: auto
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
training:
  seed: 42
  batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  epochs: 1
  learning_rate: 0.00005
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  optimizer: paged_adamw_8bit
  save_steps: 1
  logging_steps: 1
  save_total_limit: 3
  max_steps: -1
  output_root: outputs/classic_v02
  cpu_offload: false
inference:
  max_input_tokens: 2048
  max_new_tokens: 768
  do_sample: false
  use_cache: true
evaluation:
  suites: [rules, strategy, counterfactual, blind]
  benchmark_version: classic_benchmark_v0.1
  baseline_dir: reports/runs/base_primary
